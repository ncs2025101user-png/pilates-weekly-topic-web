<style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(id, pass) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(id + "\n" + pass), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name: "PBKDF2", salt: b64(DATA.salt), iterations: DATA.iter, hash: "SHA-256"},
    base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(DATA.iv)}, key, b64(DATA.ct));
  return new TextDecoder().decode(plain);
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("b"), msg = document.getElementById("msg");
  btn.disabled = true; msg.textContent = "確認中…";
  try {
    const html = await unlock(document.getElementById("u").value.trim(), document.getElementById("p").value);
    document.open(); document.write(html); document.close();
  } catch (err) {
    msg.textContent = "IDまたはパスワードが違います。";
    btn.disabled = false;
  }
});
